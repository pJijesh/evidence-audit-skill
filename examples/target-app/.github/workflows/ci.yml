name: CI
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: pip install -r requirements.txt && pytest
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
